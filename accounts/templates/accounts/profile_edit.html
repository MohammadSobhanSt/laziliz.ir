{% extends 'base.html' %} 

{% block title %} Profile {% endblock %} 

{% block content %}

<div class="text-center">
    <form action="" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <br>
        <button class="btn btn-dark" type="submit">Update Profile</button>
        <a class="btn btn-warning" href="{% url 'accounts:password_change' %}">Change Password</a>
    </form>
</div>

{% endblock %}
